name: Build
on:
  workflow_dispatch:
      inputs:
        package_name:
          description: "Package name of the game:"
          required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle
    - run: |
        chmod +x ./gradlew
        sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
        sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
        ./gradlew :module:assembleRelease
        echo "=== out/ ==="
        find out -type f -print || true
        ls -la out/ || true
    # Zip лежит в out/*.zip — папка иногда пустая для upload
    - uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper
        path: |
          out/*.zip
          out/magisk_module_release/**
        if-no-files-found: error
        compression-level: 0
